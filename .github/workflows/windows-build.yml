name: MENKIA Windows x64 build

on:
  push:
    branches:
      - develop
      - feature/menkia-mod-manager-hud
      - fix/mod-manager-security-compat
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout MENKIA with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install MinGW, Qt and build dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkgconf

      - name: Configure MENKIA
        shell: msys2 {0}
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/mingw64 \
            -DCMAKE_INSTALL_PREFIX="$(cygpath -m "$PWD/dist")" \
            -DLauncher_LAYOUT=win-bundle \
            -DLauncher_FILES_MIRRORS= \
            -DLauncher_META_MIRRORS=

      - name: Compile MENKIA
        shell: msys2 {0}
        run: cmake --build build --parallel 2

      - name: Run MENKIA tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Package MENKIA
        shell: msys2 {0}
        run: cmake --install build

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: MENKIA-Windows-x64
          path: dist/
          if-no-files-found: error

      - name: Create release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/*" -DestinationPath "MENKIA-Windows-x64.zip" -CompressionLevel Optimal

      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: MENKIA-Windows-x64-release
          path: MENKIA-Windows-x64.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: MENKIA-Windows-x64-release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MENKIA ${{ github.ref_name }}
          generate_release_notes: true
          files: MENKIA-Windows-x64.zip
